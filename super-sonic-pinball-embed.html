<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Sonic Pinball - Ruffle Embed</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div id="player"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "autoplay": "on",
      "unmuteOverlay": "hidden"
    };
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("player").appendChild(player);
      // NOTE: Make sure "super-sonic-pinball.swf" matches the exact file name of your uploaded SWF on GitHub
      player.load("pjinns_sonic_pinball.swf");
    });
  </script>
</body>
</html>
